location ~* \.(?:ttf|ttc|otf|eot|woff|font.css)$ {
    add_header "Access-Control-Allow-Origin" "*";
    expires 1M;
    access_log off;
    add_header Cache-Control "public";
    # frontend redirect
    location ~* ^\/app\/(?<path>.*\.(ttf|ttc|otf|eot|woff))$ {
         return 301 https://s3.amazonaws.com/assets.pivotalenergy.net/static/axis-frontend/beta/$path;
    }
}

location /robots.txt {
    access_log off;
    log_not_found off;
    alias /usr/share/nginx/html/robots.txt;
}

location /humans.txt {
    access_log off;
    log_not_found off;
    alias /usr/share/nginx/html/humans.txt;
}

location /sitemap.xml {
    access_log off;
    log_not_found off;
    alias /usr/share/nginx/html/sitemap.xml;
}

error_page 400 /400;
location = /400 {
    if ($lb) {
        access_log  off;
    }
    return 400;
}

error_page 500 502 503 504 /50x.html;
location /50x.html {
    root /usr/share/nginx/html;
    internal;
}

error_page 404 /404.html;
location /404.html {
    root /usr/share/nginx/html;
    internal;
}

# Health check url
#
# This proxies to the application rather than answering in nginx. A static
# "return 200" only proves nginx is alive, so an instance with no application
# code -- or a wedged uwsgi -- still passed and was given live traffic, which
# is how the 2026-08-17 outage produced user-visible 504s.
# See tensor-infrastructure#70.
#
# Deliberately shallow: it proves nginx -> uwsgi -> django on THIS instance and
# touches no shared dependency. Checking the database/cache/broker here would
# fail every instance at once during a dependency blip and deregister the whole
# target group. Those live on /api/v3/health/?deep=true for monitoring only.
location /elb-health {
  # Silent while the check passes, logged the moment it does not. Previously
  # this was `access_log off` for all load balancer traffic, which meant a
  # failing health check left no trace anywhere and could not be diagnosed.
  access_log /var/log/nginx/access.log main if=$health_check_failed;

  include /etc/nginx/uwsgi_params;

  # Health checks arrive with the instance IP as the Host header; $my_host
  # normalises that to a real hostname so django's ALLOWED_HOSTS accepts it.
  uwsgi_param HTTP_HOST $my_host;

  # Route this to the application health endpoint. PATH_INFO is what django
  # routes on (uwsgi_params maps it to $document_uri), so both it and
  # REQUEST_URI are pinned explicitly rather than rewritten.
  uwsgi_param PATH_INFO    /api/v3/health/;
  uwsgi_param REQUEST_URI  /api/v3/health/;
  uwsgi_param QUERY_STRING "";

  # Marks this request as load-balancer sourced so the view skips throttling.
  # This is intentionally NOT named HTTP_* -- nginx prefixes real request
  # headers with HTTP_, so a client cannot forge a bare environ key, and this
  # location is the only place it is ever set.
  uwsgi_param HEALTH_SOURCE lb;

  # Bound the wait below the ALB's 5s health-check timeout so a hung uwsgi
  # fails fast instead of holding the connection open with no response.
  uwsgi_connect_timeout 2s;
  uwsgi_send_timeout    4s;
  uwsgi_read_timeout    4s;

  uwsgi_pass django;
}

location ~* .*.php$ {
	deny all;
	access_log off;
	log_not_found off;
}

location ~* .*.aspx {
	deny all;
	access_log off;
	log_not_found off;
}

location ~* .*/.env {
	deny all;
	access_log off;
	log_not_found off;
}
