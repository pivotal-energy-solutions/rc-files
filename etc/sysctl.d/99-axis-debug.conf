# Magic SysRq. The default on these hosts is 16 (sync only), which is why the
# serial console produced no output at all during the 2026-08-17/18 outage -
# a wedged host could not be inspected by any means.
#
# 1 enables all SysRq functions, including the ones that matter when a box is
# memory-starved but still running: t (task dump), m (memory dump), w (blocked
# tasks). These are read-only diagnostics.
kernel.sysrq = 1
