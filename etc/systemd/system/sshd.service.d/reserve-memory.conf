[Service]
# Protected memory the kernel will not reclaim. Without this, sshd is reclaimed
# under pressure like anything else - on 2026-08-18 it accepted the TCP
# connection and then never completed banner exchange, at the one moment we most
# needed to get onto the box.
#
# 64M is enough to accept a connection and fork a session. Trivial against 31 GB.
MemoryMin=64M
